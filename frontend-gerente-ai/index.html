<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />

    <link rel="icon" type="image/x-icon" href="/Luka.ico" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />

    <title>Luka AI</title>

    <meta
      name="description"
      content="Tu negocio, tus números y Luka para ayudarte a entenderlos. Pregúntale lo que necesites, toma mejores decisiones y lleva tu negocio sin tanto enredo."
    />

    <meta
      name="robots"
      content="noindex, nofollow"
    />

    <!-- =====================================================
         INITIAL LOADER + BASE STYLES
    ====================================================== -->

    <style>
      html,
      body {
        height: 100%;
        margin: 0;
      }

      #root {
        height: 100%;
      }

      /* =====================================================
         LUKA INITIAL LOADER
      ====================================================== */

      #initial-loader {
        position: fixed;
        inset: 0;
        z-index: 999999;

        display: flex;
        align-items: center;
        justify-content: center;

        background: #ffffff;

        opacity: 1;

        transition:
          opacity 500ms cubic-bezier(0.22, 1, 0.36, 1);

        pointer-events: all;

        isolation: isolate;
      }

      /* =====================================================
         DARK MODE
      ====================================================== */

      html.dark #initial-loader {
        background: #070b12;
      }

      /* =====================================================
         LUKA LOGO
      ====================================================== */

      #initial-loader-logo {
        width: 82px;
        height: 82px;

        object-fit: contain;

        opacity: 0;

        transform: scale(0.88);

        animation:
          luka-loader-in
          550ms
          cubic-bezier(0.22, 1, 0.36, 1)
          forwards,

          luka-heartbeat
          1.8s
          ease-in-out
          0.55s
          infinite;
      }

      /* =====================================================
         LOGO ENTRY
      ====================================================== */

      @keyframes luka-loader-in {
        0% {
          opacity: 0;
          transform: scale(0.88);
        }

        100% {
          opacity: 1;
          transform: scale(1);
        }
      }

      /* =====================================================
         LUKA HEARTBEAT
         
         PUM
         
         pausa
         
         PUM
         
         pausa
         
         PUM
         
         Un solo latido por ciclo.
      ====================================================== */

      @keyframes luka-heartbeat {
        0% {
          transform: scale(1);
        }

        10% {
          transform: scale(1.10);
        }

        20% {
          transform: scale(0.99);
        }

        30% {
          transform: scale(1);
        }

        100% {
          transform: scale(1);
        }
      }

      /* =====================================================
         LOADER EXIT
      ====================================================== */

      #initial-loader.is-hidden {
        opacity: 0;
        pointer-events: none;
      }

      /* =====================================================
         ACCESSIBILITY
      ====================================================== */

      @media (prefers-reduced-motion: reduce) {
        #initial-loader {
          transition: none;
        }

        #initial-loader-logo {
          animation: none;
          opacity: 1;
          transform: none;
        }
      }
    </style>

    <!-- =====================================================
         THEME DETECTION BEFORE REACT
    ====================================================== -->

    <script>
      (() => {
        const storedTheme = localStorage.getItem("theme");

        const systemDark = window.matchMedia(
          "(prefers-color-scheme: dark)"
        ).matches;

        let isDark = systemDark;

        /*
         * Tema oscuro
         */

        if (storedTheme === "dark") {
          isDark = true;
        }

        /*
         * Tema claro
         */

        if (storedTheme === "light") {
          isDark = false;
        }

        /*
         * Tema automático por horario
         *
         * 19:00 → 05:59 = oscuro
         * 06:00 → 18:59 = claro
         */

        if (storedTheme === "schedule") {
          const hour = new Date().getHours();

          isDark = hour >= 19 || hour < 6;
        }

        /*
         * Aplicar tema directamente al <html>
         * antes de que React cargue.
         */

        document.documentElement.classList.toggle(
          "dark",
          isDark
        );

        /*
         * Guardar el estado inicial de Luka.
         */

        window.__LUKA_INITIAL_DARK__ = isDark;
      })();
    </script>

    <!-- =====================================================
         GOOGLE FONTS
    ====================================================== -->

    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
    />

    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin
    />

    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>

  <body>
    <!-- =====================================================
         LUKA INITIAL LOADER
    ====================================================== -->

    <div
      id="initial-loader"
      role="status"
      aria-label="Cargando Luka AI"
    >
      <img
        id="initial-loader-logo"
        src="/Luka.ico"
        alt="Luka AI"
      />
    </div>

    <!-- =====================================================
         REACT ROOT
    ====================================================== -->

    <div id="root"></div>

    <!-- =====================================================
         APPLICATION
    ====================================================== -->

    <script
      type="module"
      src="/src/main.tsx"
    ></script>
  </body>
</html>
