version: '3.9'

services:
  api:
    build: .
    container_name: gerente-ai-api
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
    
    environment:
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1d}

  

