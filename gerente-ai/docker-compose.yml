services:
  api:
    build:
      context: .
      # Etapa de desarrollo: Nest en modo watch.
      # La etapa de producción vive en el mismo Dockerfile y es la que usa Render.
      target: development

    container_name: gerente-ai-api

    ports:
      - '3000:3000'

    volumes:
      # El código se monta desde el host para que el watch recargue en caliente.
      - .:/app

      # node_modules se deja como volumen anónimo para que el del contenedor
      # (instalado para Alpine) no lo pise el del host.
      - /app/node_modules

    environment:
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1d}

      # Correo: sin estas variables, POST /auth/register falla
      # al enviar la verificación.
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      SMTP_FROM: ${SMTP_FROM}
      FRONTEND_URL: ${FRONTEND_URL}

      # Integración con n8n e IA.
      NODE_ENV: ${NODE_ENV:-development}
      N8N_API_KEY: ${N8N_API_KEY}
      FINANCE_DATA_SOURCE: ${FINANCE_DATA_SOURCE:-prisma}
      AI_PROVIDER: ${AI_PROVIDER:-echo}
      AI_MODEL: ${AI_MODEL}
      GROQ_API_KEY: ${GROQ_API_KEY}
      AI_TIMEOUT_MS: ${AI_TIMEOUT_MS:-30000}
      CORS_ORIGINS: ${CORS_ORIGINS}

      # Google OAuth
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}

  postgres:
    image: postgres:17

    container_name: gerente-ai-postgres

    restart: unless-stopped

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: business_ai

    ports:
      - '5432:5432'

    volumes:
      - gerente_ai_postgres_data:/var/lib/postgresql/data

volumes:
  gerente_ai_postgres_data: